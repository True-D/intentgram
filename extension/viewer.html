<!doctype html>
<html><head><meta charset="utf-8"><title>Intentgram</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="styles.css">
</head>
<body><main>
  <header>
    <h1>Your feed, by topic</h1>
    <a href="settings.html">Manage</a>
  </header>
  <div class="muted">Read from what Instagram already sent to your browser, and kept on this computer.</div>
  <h2>Categories</h2>
  <div class="chips" id="chips"></div>
  <h2>Posts</h2>
  <div class="bar">
    <select id="type"><option value="">All types</option><option value="photo">Photos</option><option value="carousel">Carousels</option><option value="video">Videos</option><option value="reel">Reels</option></select>
    <select id="when"><option value="">Any time</option><option value="today">Today</option><option value="yesterday">Yesterday</option><option value="week">Last 7 days</option><option value="custom">Custom…</option></select>
    <span id="customRange" class="hidden"><input type="date" id="from"> to <input type="date" id="to"></span>
    <input id="loc" list="placeList" placeholder="Place: Taipei, Taiwan, Kyoto…" autocomplete="off" style="min-width:220px">
    <datalist id="placeList"></datalist>
    <input id="q" placeholder="Keywords">
    <select id="kind"><option value="followed" selected>Followed content</option><option value="">All sources</option><option value="other">Suggested</option><option value="ad">Ads</option></select>
    <select id="acct"><option value="">All accounts</option></select>
  </div>
  <div class="muted" id="count"></div>
  <div class="muted" id="locNote"></div>
  <div class="grid" id="grid" style="margin-top:10px"></div>
</main>
<script src="classifier.js"></script><script src="events.js"></script><script src="geo.js"></script><script src="store.js"></script><script src="shared.js"></script><script src="viewer.js"></script>
</body></html>
