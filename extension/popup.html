<!doctype html>
<html><head><meta charset="utf-8">
<style>
  body { font: 14px system-ui, sans-serif; width: 260px; margin: 0; padding: 14px; color: #1d1d1f; }
  h1 { font-size: 15px; margin: 0 0 8px; }
  .n { font-size: 28px; font-weight: 600; }
  .muted { color: #6e6e73; font-size: 12px; }
  button { display: block; width: 100%; margin-top: 8px; padding: 8px; border: 1px solid #d2d2d7; border-radius: 8px; background: #fff; cursor: pointer; font: inherit; }
  button.primary { background: #6b4fd8; color: #fff; border-color: #6b4fd8; }
</style></head>
<body>
  <h1>Intentgram</h1>
  <div class="n" id="count">0</div>
  <div class="muted" id="sub">posts captured</div>
  <button class="primary" id="open">Open collected posts</button>
  <button id="settings">Manage</button>
  <script src="popup.js"></script>
</body></html>
