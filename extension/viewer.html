<!doctype html>
<html><head><meta charset="utf-8"><title>Intently</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="styles.css">
</head>
<body><main class="feed">
  <header class="toolbar">
    <h1>Intently</h1>
    <div class="tabs" id="source" role="tablist" aria-label="Which posts"></div>
    <label class="search"><span aria-hidden="true">⌕</span><input id="q" type="search" placeholder="Search captions and accounts" aria-label="Search captions and accounts"></label>
    <button class="plain filt" id="filtersBtn" aria-expanded="false" aria-controls="filters">Filters <b id="filterCount" class="hidden"></b><span aria-hidden="true">▾</span></button>
    <a href="settings.html" class="manage">Manage</a>
  </header>
  <div class="note muted hidden" id="pausedNote">Collecting is paused, so new posts aren't being saved. <button class="act" id="resume">Resume collecting</button></div>

  <section class="filters hidden" id="filters" aria-label="Filters">
    <div><div class="lbl">Posted</div><div class="opts" id="when" data-v=""></div>
      <div id="customRange" class="hidden range"><input type="date" id="from" aria-label="From"> to <input type="date" id="to" aria-label="To"></div></div>
    <div><div class="lbl">Place</div><input id="loc" list="placeList" placeholder="Taipei, Taiwan, Kyoto…" autocomplete="off"><datalist id="placeList"></datalist></div>
    <div><div class="lbl">Account</div><select id="acct"><option value="">All accounts</option></select></div>
    <div><div class="lbl">Ads</div><label class="check"><input type="checkbox" id="showAds"> Show ads under Suggested and All</label></div>
    <div class="foot"><span class="muted" id="matchCount"></span><button class="link" id="clearAll">Clear all</button></div>
  </section>

  <div class="layout">
    <nav class="side" id="chips" aria-label="Categories"></nav>
    <section class="posts">
      <div class="status"><span id="pills"></span><span id="count"></span><span class="muted" id="aiNote"></span><button class="act hidden" id="aiOn">Turn on</button></div>
      <div class="muted" id="locNote"></div>
      <div class="grid" id="grid"></div>
    </section>
  </div>
</main>
<script src="classifier.js"></script><script src="events.js"></script><script src="geo.js"></script><script src="store.js"></script><script src="ai.js"></script><script src="shared.js"></script><script src="viewer.js"></script>
</body></html>
